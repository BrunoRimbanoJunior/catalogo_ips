<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seu código de acesso ao Catálogo IPS</title>
  </head>
  <body style="margin: 0; padding: 24px; background-color: #f3f4f6; font-family: Arial, sans-serif; color: #111827;">
    <table role="presentation" style="width: 100%; max-width: 520px; margin: 0 auto; background-color: #ffffff; border-radius: 12px;">
      <tr>
        <td style="padding: 32px;">
          <h1 style="margin: 0 0 20px; font-size: 24px;">Catálogo IPS</h1>
          <p>Digite o código abaixo no aplicativo para confirmar seu e-mail e continuar:</p>
          <p style="margin: 24px 0; font-size: 32px; font-weight: bold; text-align: center;">{{ .Token }}</p>
          <p>Este código é de uso único. Se ele expirar, solicite um novo código pelo aplicativo.</p>
          <p>Se você não solicitou este acesso, ignore este e-mail.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
